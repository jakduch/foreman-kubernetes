{{- if .Values.recurringTasks.enabled }}
{{- $root := . }}
{{- range $index, $task := .Values.recurringTasks.tasks }}
{{- if $index }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "foreman-stack.fullname" $root }}-{{ $task.name }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" $root "component" "foreman-cron") | nindent 4 }}
spec:
  schedule: {{ $task.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ $root.Release.Name }}
            app.kubernetes.io/component: foreman-cron
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "foreman-stack.serviceAccountName" $root }}
          securityContext:
            fsGroup: 994
          containers:
            - name: rake
              image: {{ include "foreman-stack.image" $root.Values.foreman.image }}
              imagePullPolicy: {{ $root.Values.foreman.image.pullPolicy }}
              command:
                - foreman-rake
                - {{ $task.rakeTask }}
              env:
                {{- include "foreman-stack.foremanEnv" $root | nindent 16 }}
              envFrom:
                - secretRef:
                    name: {{ $root.Values.foreman.existingEnvSecret }}
              volumeMounts:
                {{- include "foreman-stack.foremanVolumeMounts" $root | nindent 16 }}
          volumes:
            {{- include "foreman-stack.foremanVolumes" $root | nindent 12 }}
{{- end }}
{{- end }}
