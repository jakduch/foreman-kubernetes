{{- if and .Values.migrations.enabled (not .Values.maintenance.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "foreman-stack.fullname" . }}-pulp-migrate-{{ .Release.Revision }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-migrate") | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pulp-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "foreman-stack.serviceAccountName" . }}
      securityContext:
        fsGroup: 700
      containers:
        - name: migrate
          image: {{ include "foreman-stack.image" .Values.pulp.image }}
          imagePullPolicy: {{ .Values.pulp.image.pullPolicy }}
          command:
            - pulpcore-manager
            - migrate
            - --noinput
          env:
            {{- include "foreman-stack.pulpEnv" . | nindent 12 }}
          volumeMounts:
            - name: pulp-config
              mountPath: /etc/pulp/certs/database_fields.symmetric.key
              subPath: database_fields.symmetric.key
              readOnly: true
            {{- include "foreman-stack.pulpDatabaseCaVolumeMount" . | nindent 12 }}
      volumes:
        - name: pulp-config
          secret:
            secretName: {{ .Values.pulp.existingConfigSecret }}
        {{- include "foreman-stack.pulpDatabaseCaVolume" . | nindent 8 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "foreman-stack.fullname" . }}-foreman-migrate-{{ .Release.Revision }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "foreman-migrate") | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: foreman-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "foreman-stack.serviceAccountName" . }}
      securityContext:
        fsGroup: 994
      initContainers:
        {{- include "foreman-stack.pulpMigrationWait" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "foreman-stack.image" .Values.foreman.image }}
          imagePullPolicy: {{ .Values.foreman.image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - bin/rails db:migrate && bin/rails db:seed
          env:
            {{- include "foreman-stack.foremanEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.foreman.existingEnvSecret }}
          volumeMounts:
            {{- include "foreman-stack.foremanVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "foreman-stack.foremanVolumes" . | nindent 8 }}
        - name: pulp-config
          secret:
            secretName: {{ .Values.pulp.existingConfigSecret }}
        {{- include "foreman-stack.pulpDatabaseCaVolume" . | nindent 8 }}
{{- end }}
