apiVersion: v1
kind: Service
metadata:
  name: {{ include "foreman-stack.fullname" . }}-candlepin
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "candlepin") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: candlepin
  ports:
    - name: https
      port: {{ .Values.candlepin.service.port }}
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foreman-stack.fullname" . }}-candlepin
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "candlepin") | nindent 4 }}
spec:
  replicas: {{ .Values.candlepin.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: candlepin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "foreman-stack.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: candlepin
    spec:
      serviceAccountName: {{ include "foreman-stack.serviceAccountName" . }}
      securityContext:
        fsGroup: 53
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: candlepin
          image: {{ include "foreman-stack.image" .Values.candlepin.image }}
          imagePullPolicy: {{ .Values.candlepin.image.pullPolicy }}
          ports:
            - name: https
              containerPort: 23443
          volumeMounts:
            - name: candlepin-config
              mountPath: /etc/candlepin/candlepin.conf
              subPath: candlepin.conf
              readOnly: true
            - name: candlepin-config
              mountPath: /etc/tomcat/server.xml
              subPath: server.xml
              readOnly: true
            - name: candlepin-config
              mountPath: /etc/tomcat/tomcat.conf
              subPath: tomcat.conf
              readOnly: true
            - name: candlepin-config
              mountPath: /etc/tomcat/logging.properties
              subPath: logging.properties
              readOnly: true
            - name: candlepin-config
              mountPath: /var/lib/tomcat/webapps/candlepin/WEB-INF/classes/logback.xml
              subPath: logback.xml
              readOnly: true
            - name: candlepin-config
              mountPath: /etc/candlepin/certs/candlepin-ca.crt
              subPath: candlepin-ca.crt
              readOnly: true
            - name: candlepin-config
              mountPath: /etc/candlepin/certs/candlepin-ca.key
              subPath: candlepin-ca.key
              readOnly: true
            - name: candlepin-config
              mountPath: /etc/candlepin/certs/tomcat.crt
              subPath: tomcat.crt
              readOnly: true
            - name: candlepin-config
              mountPath: /etc/candlepin/certs/tomcat.key
              subPath: tomcat.key
              readOnly: true
            - name: candlepin-config
              mountPath: /etc/candlepin/certs/db-ca.crt
              subPath: db-ca.crt
              readOnly: true
          readinessProbe:
            httpGet:
              path: /candlepin/status
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /candlepin/status
              port: https
              scheme: HTTPS
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.candlepin.resources | nindent 12 }}
      volumes:
        - name: candlepin-config
          secret:
            secretName: {{ .Values.candlepin.existingConfigSecret }}
