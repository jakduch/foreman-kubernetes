apiVersion: v1
kind: Service
metadata:
  name: {{ include "foreman-stack.fullname" . }}-pulp-api
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-api") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: pulp-api
  ports:
    - name: http
      port: {{ .Values.pulp.api.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "foreman-stack.fullname" . }}-pulp-content
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-content") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: pulp-content
  ports:
    - name: http
      port: {{ .Values.pulp.content.port }}
      targetPort: http
{{- $root := . }}
{{- $services := list
  (dict "name" "api" "replicas" .Values.pulp.api.replicas "port" .Values.pulp.api.port "workers" .Values.pulp.api.gunicornWorkers)
  (dict "name" "content" "replicas" .Values.pulp.content.replicas "port" .Values.pulp.content.port "workers" .Values.pulp.content.gunicornWorkers)
-}}
{{- range $service := $services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foreman-stack.fullname" $root }}-pulp-{{ $service.name }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" $root "component" (printf "pulp-%s" $service.name)) | nindent 4 }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: pulp-{{ $service.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "foreman-stack.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: pulp-{{ $service.name }}
    spec:
      serviceAccountName: {{ include "foreman-stack.serviceAccountName" $root }}
      securityContext:
        fsGroup: 700
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: pulp-{{ $service.name }}
          image: {{ include "foreman-stack.image" $root.Values.pulp.image }}
          imagePullPolicy: {{ $root.Values.pulp.image.pullPolicy }}
          command:
            - /usr/bin/pulpcore-{{ $service.name }}
          args:
            - --bind
            - 0.0.0.0:{{ $service.port }}
            - --workers
            - {{ $service.workers | quote }}
            - --access-logfile
            - "-"
            - --log-level
            - info
            - --no-control-socket
          ports:
            - name: http
              containerPort: {{ $service.port }}
          env:
            {{- include "foreman-stack.pulpEnv" $root | nindent 12 }}
          volumeMounts:
            - name: pulp-data
              mountPath: /var/lib/pulp
            - name: pulp-config
              mountPath: /etc/pulp/certs/database_fields.symmetric.key
              subPath: database_fields.symmetric.key
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml $root.Values.pulp.resources | nindent 12 }}
      volumes:
        - name: pulp-data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-pulp" (include "foreman-stack.fullname" $root)) $root.Values.pulp.storage.existingClaim }}
        - name: pulp-config
          secret:
            secretName: {{ $root.Values.pulp.existingConfigSecret }}
      {{- include "foreman-stack.topologySpread" (dict "Values" $root.Values "Release" $root.Release "component" (printf "pulp-%s" $service.name)) | nindent 6 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foreman-stack.fullname" . }}-pulp-worker
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.pulp.workers.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pulp-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "foreman-stack.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pulp-worker
    spec:
      serviceAccountName: {{ include "foreman-stack.serviceAccountName" . }}
      securityContext:
        fsGroup: 700
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: pulp-worker
          image: {{ include "foreman-stack.image" .Values.pulp.image }}
          imagePullPolicy: {{ .Values.pulp.image.pullPolicy }}
          command:
            - /usr/bin/pulp-worker
          env:
            {{- include "foreman-stack.pulpEnv" . | nindent 12 }}
          volumeMounts:
            - name: pulp-data
              mountPath: /var/lib/pulp
            - name: pulp-config
              mountPath: /etc/pulp/certs/database_fields.symmetric.key
              subPath: database_fields.symmetric.key
              readOnly: true
          resources:
            {{- toYaml .Values.pulp.resources | nindent 12 }}
      volumes:
        - name: pulp-data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-pulp" (include "foreman-stack.fullname" .)) .Values.pulp.storage.existingClaim }}
        - name: pulp-config
          secret:
            secretName: {{ .Values.pulp.existingConfigSecret }}
      {{- include "foreman-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "pulp-worker") | nindent 6 }}
