{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.egress.enabled }}
{{- if eq (len .Values.networkPolicy.egress.database.peers) 0 }}
{{- fail "networkPolicy.egress.database.peers must identify the externally managed PostgreSQL endpoints" }}
{{- end }}
{{- if eq (len .Values.networkPolicy.egress.valkey.peers) 0 }}
{{- fail "networkPolicy.egress.valkey.peers must identify the externally managed Valkey endpoint" }}
{{- end }}
{{- $root := . }}
{{- $database := .Values.networkPolicy.egress.database }}
{{- $valkey := .Values.networkPolicy.egress.valkey }}
{{- $dns := .Values.networkPolicy.egress.dns }}
{{- $foremanExternal := .Values.networkPolicy.egress.external.foreman }}
{{- $pulpExternal := .Values.networkPolicy.egress.external.pulp }}
{{- $candlepinExternal := .Values.networkPolicy.egress.external.candlepin }}
{{- if and .Values.candlepin.highAvailability.enabled (eq (len $candlepinExternal.peers) 0) }}
{{- fail "networkPolicy.egress.external.candlepin.peers must identify the external Artemis broker when Candlepin HA is enabled" }}
{{- end }}
{{- if and (eq .Values.pulp.storage.backend "s3") (eq (len $pulpExternal.peers) 0) }}
{{- fail "networkPolicy.egress.external.pulp.peers must identify the S3 endpoint when Pulp object storage is enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foreman-stack.fullname" . }}-foreman-egress
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "foreman-egress") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values:
          - foreman
          - dynflow-orchestrator
          - dynflow-worker
          - dynflow-worker-hosts-queue
          - foreman-cron
          - foreman-migrate
          - pulp-registration
  policyTypes:
    - Egress
  egress:
    - to:
        - {{- toYaml $dns | nindent 10 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- toYaml $database.peers | nindent 8 }}
      ports:
        {{- range $database.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        {{- toYaml $valkey.peers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.valkey.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: candlepin
      ports:
        - protocol: TCP
          port: {{ .Values.candlepin.service.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: pulp-control-proxy
      ports:
        - protocol: TCP
          port: {{ .Values.pulp.controlProxy.port }}
    {{- if gt (len $foremanExternal.peers) 0 }}
    - to:
        {{- toYaml $foremanExternal.peers | nindent 8 }}
      ports:
        {{- range $foremanExternal.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foreman-stack.fullname" . }}-pulp-egress
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-egress") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values:
          - pulp-api
          - pulp-content
          - pulp-worker
          - pulp-migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - {{- toYaml $dns | nindent 10 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- toYaml $database.peers | nindent 8 }}
      ports:
        {{- range $database.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        {{- toYaml $valkey.peers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.valkey.port }}
    {{- if gt (len $pulpExternal.peers) 0 }}
    - to:
        {{- toYaml $pulpExternal.peers | nindent 8 }}
      ports:
        {{- range $pulpExternal.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foreman-stack.fullname" . }}-candlepin-egress
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "candlepin-egress") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values:
          - candlepin
          - candlepin-migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - {{- toYaml $dns | nindent 10 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- toYaml $database.peers | nindent 8 }}
      ports:
        {{- range $database.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- if and .Values.candlepin.highAvailability.enabled (gt (len $candlepinExternal.peers) 0) }}
    - to:
        {{- toYaml $candlepinExternal.peers | nindent 8 }}
      ports:
        {{- range $candlepinExternal.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}-egress
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-control-proxy-egress") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pulp-control-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - {{- toYaml $dns | nindent 10 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: pulp-api
      ports:
        - protocol: TCP
          port: {{ .Values.pulp.api.port }}
{{- end }}
