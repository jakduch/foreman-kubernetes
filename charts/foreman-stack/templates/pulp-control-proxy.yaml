apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-control-proxy") | nindent 4 }}
data:
  default.conf: |
    map $ssl_client_s_dn $pulp_remote_user {
      default "";
      ~(?:^|,)CN={{ regexQuoteMeta .Values.platform.fqdn }}(?:,|$) admin;
      {{- range .Values.pulp.controlProxy.trustedClientCommonNames }}
      ~(?:^|,)CN={{ regexQuoteMeta . }}(?:,|$) admin;
      {{- end }}
    }

    upstream pulp_api {
      server {{ include "foreman-stack.pulpApiServiceName" . }}:{{ .Values.pulp.api.port }};
      keepalive 32;
    }

    server {
      listen {{ .Values.pulp.controlProxy.port }} ssl;
      server_name _;
      server_tokens off;
      client_max_body_size 0;

      ssl_certificate /etc/nginx/pki/tls.crt;
      ssl_certificate_key /etc/nginx/pki/tls.key;
      ssl_client_certificate /etc/nginx/pki/ca.crt;
      ssl_verify_client on;
      ssl_verify_depth 3;
      ssl_protocols TLSv1.2 TLSv1.3;

      location / {
        if ($pulp_remote_user = "") { return 403; }

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header REMOTE-USER $pulp_remote_user;
        proxy_set_header X-CLIENT-CERT "";
        proxy_pass http://pulp_api;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-control-proxy") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: pulp-control-proxy
  ports:
    - name: https
      port: {{ .Values.pulp.controlProxy.service.port }}
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-control-proxy") | nindent 4 }}
spec:
  replicas: {{ .Values.pulp.controlProxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pulp-control-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "foreman-stack.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pulp-control-proxy
      annotations:
        checksum/config: {{ toJson (dict "fqdn" .Values.platform.fqdn "controlProxy" .Values.pulp.controlProxy "apiPort" .Values.pulp.api.port) | sha256sum }}
    spec:
      serviceAccountName: {{ include "foreman-stack.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ include "foreman-stack.image" .Values.pulp.controlProxy.image }}
          imagePullPolicy: {{ .Values.pulp.controlProxy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: https
              containerPort: {{ .Values.pulp.controlProxy.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: certificates
              mountPath: /etc/nginx/pki
              readOnly: true
            - name: temporary
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.pulp.controlProxy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}
        - name: certificates
          secret:
            secretName: {{ .Values.pulp.controlProxy.existingCertificateSecret }}
        - name: temporary
          emptyDir: {}
      {{- include "foreman-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "pulp-control-proxy") | nindent 6 }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pulp-control-proxy
{{- end }}
