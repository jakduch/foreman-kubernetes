apiVersion: v1
kind: Service
metadata:
  name: {{ include "foreman-stack.fullname" . }}-foreman
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "foreman") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: foreman
  ports:
    - name: http
      port: {{ .Values.foreman.service.port }}
      targetPort: http
{{- if not .Values.maintenance.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foreman-stack.fullname" . }}-foreman
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "foreman") | nindent 4 }}
spec:
  {{- if not .Values.foreman.autoscaling.enabled }}
  replicas: {{ .Values.foreman.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: foreman
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "foreman-stack.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: foreman
      annotations:
        checksum/config: {{ toJson (dict "platform" .Values.platform "valkey" .Values.valkey "foreman" .Values.foreman "candlepinService" (include "foreman-stack.candlepinServiceName" .)) | sha256sum }}
        checksum/secrets: {{ .Values.secretRolloutToken | sha256sum }}
    spec:
      serviceAccountName: {{ include "foreman-stack.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 994
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 994
        runAsNonRoot: true
        runAsUser: 994
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        {{- include "foreman-stack.foremanMigrationWait" . | nindent 8 }}
      {{- end }}
      containers:
        - name: foreman
          image: {{ include "foreman-stack.image" .Values.foreman.image }}
          imagePullPolicy: {{ .Values.foreman.image.pullPolicy }}
          securityContext:
            {{- include "foreman-stack.restrictedContainerSecurityContext" (dict "runAsUser" 994 "runAsGroup" 994) | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            {{- include "foreman-stack.foremanEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.foreman.existingEnvSecret }}
          volumeMounts:
            {{- include "foreman-stack.foremanVolumeMounts" . | nindent 12 }}
            {{- include "foreman-stack.foremanAvatarVolumeMount" . | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v2/ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            {{- toYaml .Values.foreman.resources | nindent 12 }}
      volumes:
        {{- include "foreman-stack.foremanVolumes" . | nindent 8 }}
        {{- include "foreman-stack.foremanAvatarVolume" . | nindent 8 }}
      {{- include "foreman-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "foreman") | nindent 6 }}
{{- $minimumReplicas := ternary .Values.foreman.autoscaling.minReplicas .Values.foreman.replicas .Values.foreman.autoscaling.enabled }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int $minimumReplicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "foreman-stack.fullname" . }}-foreman
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: foreman
{{- end }}
{{- end }}
