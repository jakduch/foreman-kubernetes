nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

platform:
  fqdn: foreman.example.test
  domain: example.test
  externalUrl: https://foreman.example.test
  aliases: []
  trustedProxies: []

ingress:
  enabled: false
  className: nginx
  foreman:
    host: foreman.example.test
    tlsSecret: foreman-ingress-tls
    clientCaSecret: ingress-client-ca
    annotations: {}
  pulpContent:
    host: content.example.test
    tlsSecret: pulp-content-ingress-tls
    clientCaSecret: ingress-client-ca
    annotations: {}

valkey:
  host: valkey.example.test
  port: 6379
  foremanCacheDatabase: 4
  dynflowDatabase: 6
  pulpDatabase: 8

sharedSecret:
  name: foreman-shared
  candlepinOAuthSecretKey: candlepin-oauth-secret

serviceAccount:
  create: true
  name: ""

foreman:
  image:
    repository: quay.io/foreman/foreman
    tag: nightly
    pullPolicy: IfNotPresent
  replicas: 2
  service:
    port: 3000
  existingEnvSecret: foreman-runtime
  existingCertificateSecret: foreman-certificates
  enabledPlugins:
    - foreman-tasks
    - katello
  puma:
    workers: 2
    threadsMin: 5
    threadsMax: 5
  dynflow:
    workers: 2
    workerConcurrency: 10
    hostsQueueWorkers: 1
    hostsQueueConcurrency: 5
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi

candlepin:
  image:
    repository: quay.io/foreman/candlepin
    tag: foreman-nightly
    pullPolicy: IfNotPresent
  # Phase 1 deliberately permits one replica only. See docs/runtime-contracts.md.
  replicas: 1
  existingRuntimeSecret: candlepin-runtime
  databasePasswordSecretKey: database-password
  existingCertificateSecret: candlepin-certificates
  existingDatabaseCaSecret: ""
  database:
    host: postgres.example.test
    port: 5432
    name: candlepin
    user: candlepin
    sslMode: disable
  java:
    xms: 1g
    xmx: 4g
  service:
    port: 23443
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

pulp:
  image:
    repository: quay.io/foreman/pulp
    tag: foreman-nightly
    pullPolicy: IfNotPresent
  existingRuntimeSecret: pulp-runtime
  databasePasswordSecretKey: database-password
  djangoSecretKey: django-secret-key
  existingConfigSecret: pulp-config
  database:
    host: postgres.example.test
    port: 5432
    name: pulp
    user: pulp
    sslMode: disable
  contentOrigin: https://content.example.test
  enabledPlugins:
    - pulp_certguard
    - pulp_container
    - pulp_deb
    - pulp_file
    - pulp_rpm
    - pulp_smart_proxy
  controlProxy:
    image:
      repository: nginxinc/nginx-unprivileged
      tag: stable-alpine
      pullPolicy: IfNotPresent
    replicas: 2
    port: 8443
    service:
      port: 443
    existingCertificateSecret: pulp-control-proxy-certificates
    trustedClientCommonNames: []
    registration:
      enabled: true
      name: ""
      retryAttempts: 120
      retryIntervalSeconds: 5
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
  api:
    replicas: 2
    port: 24817
    gunicornWorkers: 2
  content:
    replicas: 2
    port: 24816
    gunicornWorkers: 2
  workers:
    replicas: 4
  storage:
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteMany
    size: 100Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

migrations:
  enabled: true
  checkIntervalSeconds: 5
  activeDeadlineSeconds: 1800

recurringTasks:
  enabled: true
  tasks:
    - name: hourly
      schedule: "7 * * * *"
      rakeTask: cron:hourly
    - name: daily
      schedule: "17 0 * * *"
      rakeTask: cron:daily
    - name: weekly
      schedule: "27 0 * * 0"
      rakeTask: cron:weekly
    - name: monthly
      schedule: "37 0 1 * *"
      rakeTask: cron:monthly

podDisruptionBudget:
  enabled: true

networkPolicy:
  enabled: true
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/component: controller

affinity:
  spreadAcrossNodes: true
