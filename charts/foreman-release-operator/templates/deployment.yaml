apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foreman-release-operator.fullname" . }}
  labels:
    {{- include "foreman-release-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "foreman-release-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "foreman-release-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "foreman-release-operator.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.controller.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /opt/foreman-kubernetes/operator/bin/foreman-release-controller
          env:
            - name: FOREMAN_KUBERNETES_ROOT
              value: /opt/foreman-kubernetes
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POLL_SECONDS
              value: {{ .Values.controller.pollSeconds | quote }}
            - name: RELEASE_LEASE_DURATION_SECONDS
              value: {{ .Values.controller.releaseLeaseDurationSeconds | quote }}
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
