apiVersion: v1
kind: Service
metadata:
  name: object-storage
  namespace: foreman
spec:
  selector:
    app: object-storage
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-storage
  namespace: foreman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-storage
  template:
    metadata:
      labels:
        app: object-storage
    spec:
      automountServiceAccountToken: false
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
          args:
            - mini
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -s3.port=8333
          env:
            - name: AWS_ACCESS_KEY_ID
              value: foreman-pulp-test
            - name: AWS_SECRET_ACCESS_KEY
              value: foreman-pulp-secret-test
            - name: S3_BUCKET
              value: foreman-pulp-probe
          ports:
            - name: s3
              containerPort: 8333
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
