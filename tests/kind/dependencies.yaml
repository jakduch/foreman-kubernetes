apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: foreman
data:
  10-databases.sql: |
    CREATE USER foreman WITH PASSWORD 'foreman-test';
    CREATE DATABASE foreman OWNER foreman;
    CREATE USER candlepin WITH PASSWORD 'candlepin-test';
    CREATE DATABASE candlepin OWNER candlepin;
    CREATE USER pulp WITH PASSWORD 'pulp-test';
    CREATE DATABASE pulp OWNER pulp;
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: foreman
spec:
  selector:
    app: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: foreman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: postgres-test
          readinessProbe:
            exec:
              command:
                - pg_isready
                - --username=postgres
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgresql-init
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: foreman
spec:
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: foreman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          args:
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: foreman-kind-pulp-data
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: foreman-kind-rwx
  hostPath:
    path: /var/local/foreman-kind-pulp
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulp-data
  namespace: foreman
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: foreman-kind-rwx
  volumeName: foreman-kind-pulp-data
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: foreman-kind-recovery-repository
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: foreman-kind-recovery
  hostPath:
    path: /var/local/foreman-kind-recovery
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recovery-repository
  namespace: foreman
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: foreman-kind-recovery
  volumeName: foreman-kind-recovery-repository
  resources:
    requests:
      storage: 20Gi
