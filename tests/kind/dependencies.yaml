apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: foreman
data:
  10-databases.sql: |
    CREATE USER foreman WITH PASSWORD 'foreman-test';
    CREATE DATABASE foreman OWNER foreman;
    CREATE USER candlepin WITH PASSWORD 'candlepin-test';
    CREATE DATABASE candlepin OWNER candlepin;
    CREATE USER pulp WITH PASSWORD 'pulp-test';
    CREATE DATABASE pulp OWNER pulp;
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: foreman
spec:
  selector:
    app: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: foreman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: postgres-test
          readinessProbe:
            exec:
              command:
                - pg_isready
                - --username=postgres
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgresql-init
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: foreman
spec:
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: foreman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          args:
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: artemis
  namespace: foreman
spec:
  selector:
    app: artemis
  ports:
    - name: core
      port: 61616
      targetPort: core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis
  namespace: foreman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artemis
  template:
    metadata:
      labels:
        app: artemis
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: artemis
          image: apache/artemis:2.57.0-alpine@sha256:ca99ce1b72c5765a15dd507db4215591c43da623cd9f42db1bcd4319e5f4b579
          env:
            # Candlepin currently creates broker sessions without separate
            # username/password parameters. Anonymous access is acceptable only
            # inside this disposable test namespace.
            - name: ANONYMOUS_LOGIN
              value: "true"
          ports:
            - name: core
              containerPort: 61616
          startupProbe:
            tcpSocket:
              port: core
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: core
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/artemis-instance
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: content-source
  namespace: foreman
data:
  PULP_MANIFEST: |
    foreman-kubernetes-content.txt,d527380869e9487a3d860b253a6aa5d454b51c419415264e90f018396e419ac5,27
  foreman-kubernetes-content.txt: |
    foreman-kubernetes-content
  python-PKG-INFO: |
    Metadata-Version: 2.1
    Name: foreman-kubernetes-pkg
    Version: 1.0.0
    Summary: Foreman Kubernetes integration fixture
  python-setup.py: |
    from setuptools import setup

    setup(
        name="foreman-kubernetes-pkg",
        version="1.0.0",
        packages=["foreman_kubernetes_pkg"],
    )
  python-module.py: |
    VERSION = "1.0.0"
  nginx.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;

      location ~ /json$ {
        default_type application/json;
        try_files $uri =404;
      }

      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: content-source
  namespace: foreman
spec:
  selector:
    app: content-source
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-source
  namespace: foreman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-source
  template:
    metadata:
      labels:
        app: content-source
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: build-content-source
          image: nginxinc/nginx-unprivileged:stable-alpine
          command:
            - /bin/sh
            - -ec
            - |
              temporary_root="${TMPDIR:-/tmp}"
              package_root="${temporary_root}/foreman_kubernetes_pkg-1.0.0"
              mkdir -p "${package_root}/foreman_kubernetes_pkg" \
                /served/packages /served/pypi/foreman-kubernetes-pkg/1.0.0 \
                /served/simple/foreman-kubernetes-pkg
              cp /source/PULP_MANIFEST /source/foreman-kubernetes-content.txt /served/
              cp /source/python-PKG-INFO "${package_root}/PKG-INFO"
              cp /source/python-setup.py "${package_root}/setup.py"
              cp /source/python-module.py "${package_root}/foreman_kubernetes_pkg/__init__.py"
              tar -C "${temporary_root}" -czf /served/packages/foreman_kubernetes_pkg-1.0.0.tar.gz \
                foreman_kubernetes_pkg-1.0.0
              checksum="$(sha256sum /served/packages/foreman_kubernetes_pkg-1.0.0.tar.gz | awk '{print $1}')"
              md5="$(md5sum /served/packages/foreman_kubernetes_pkg-1.0.0.tar.gz | awk '{print $1}')"
              size="$(wc -c < /served/packages/foreman_kubernetes_pkg-1.0.0.tar.gz | tr -d ' ')"
              printf '<!doctype html><html><body><a href="../../packages/foreman_kubernetes_pkg-1.0.0.tar.gz#sha256=%s">foreman_kubernetes_pkg-1.0.0.tar.gz</a></body></html>\n' \
                "${checksum}" > /served/simple/foreman-kubernetes-pkg/index.html
              printf '<!doctype html><html><body><a href="foreman-kubernetes-pkg/">foreman-kubernetes-pkg</a></body></html>\n' \
                > /served/simple/index.html
              cat > /served/pypi/foreman-kubernetes-pkg/json <<EOF
              {
                "info": {
                  "name": "foreman-kubernetes-pkg",
                  "summary": "Foreman Kubernetes integration fixture",
                  "version": "1.0.0",
                  "requires_python": null
                },
                "last_serial": 1,
                "releases": {
                  "1.0.0": [{
                    "comment_text": "",
                    "digests": {"md5": "${md5}", "sha256": "${checksum}"},
                    "downloads": -1,
                    "filename": "foreman_kubernetes_pkg-1.0.0.tar.gz",
                    "has_sig": false,
                    "md5_digest": "${md5}",
                    "packagetype": "sdist",
                    "python_version": "source",
                    "requires_python": null,
                    "size": ${size},
                    "upload_time": "2026-09-25T00:00:00",
                    "upload_time_iso_8601": "2026-09-25T00:00:00Z",
                    "url": "http://content-source.foreman.svc.cluster.local/packages/foreman_kubernetes_pkg-1.0.0.tar.gz",
                    "yanked": false,
                    "yanked_reason": null
                  }]
                },
                "urls": [{
                  "comment_text": "",
                  "digests": {"md5": "${md5}", "sha256": "${checksum}"},
                  "downloads": -1,
                  "filename": "foreman_kubernetes_pkg-1.0.0.tar.gz",
                  "has_sig": false,
                  "md5_digest": "${md5}",
                  "packagetype": "sdist",
                  "python_version": "source",
                  "requires_python": null,
                  "size": ${size},
                  "upload_time": "2026-09-25T00:00:00",
                  "upload_time_iso_8601": "2026-09-25T00:00:00Z",
                  "url": "http://content-source.foreman.svc.cluster.local/packages/foreman_kubernetes_pkg-1.0.0.tar.gz",
                  "yanked": false,
                  "yanked_reason": null
                }],
                "vulnerabilities": []
              }
              EOF
              cp /served/pypi/foreman-kubernetes-pkg/json \
                /served/pypi/foreman-kubernetes-pkg/1.0.0/json

              deb_root="${temporary_root}/foreman-kubernetes-deb"
              deb_filename=foreman-kubernetes-deb_1.0.0_all.deb
              deb_pool=pool/main/f/foreman-kubernetes-deb
              mkdir -p \
                "${deb_root}/control" \
                "${deb_root}/data/usr/share/foreman-kubernetes" \
                "/served/debian/${deb_pool}" \
                /served/debian/dists/stable/main/binary-amd64
              cat > "${deb_root}/control/control" <<'EOF'
              Package: foreman-kubernetes-deb
              Version: 1.0.0
              Architecture: all
              Maintainer: Foreman Kubernetes Integration
              Installed-Size: 1
              Section: admin
              Priority: optional
              Description: deterministic Foreman Kubernetes Debian fixture
              EOF
              printf '%s\n' foreman-kubernetes-debian-fixture \
                > "${deb_root}/data/usr/share/foreman-kubernetes/debian-fixture"
              printf '2.0\n' > "${deb_root}/debian-binary"
              tar -C "${deb_root}/control" -czf "${deb_root}/control.tar.gz" .
              tar -C "${deb_root}/data" -czf "${deb_root}/data.tar.gz" .
              deb_path="/served/debian/${deb_pool}/${deb_filename}"
              printf '!<arch>\n' > "${deb_path}"
              for deb_member in debian-binary control.tar.gz data.tar.gz; do
                deb_member_path="${deb_root}/${deb_member}"
                deb_member_size="$(wc -c < "${deb_member_path}" | tr -d ' ')"
                printf '%-16s%-12s%-6s%-6s%-8s%-10s`\n' \
                  "${deb_member}/" 0 0 0 100644 "${deb_member_size}" >> "${deb_path}"
                cat "${deb_member_path}" >> "${deb_path}"
                if [ "$((deb_member_size % 2))" -ne 0 ]; then
                  printf '\n' >> "${deb_path}"
                fi
              done

              deb_size="$(wc -c < "${deb_path}" | tr -d ' ')"
              deb_md5="$(md5sum "${deb_path}" | awk '{print $1}')"
              deb_sha1="$(sha1sum "${deb_path}" | awk '{print $1}')"
              deb_sha256="$(sha256sum "${deb_path}" | awk '{print $1}')"
              packages=/served/debian/dists/stable/main/binary-amd64/Packages
              cat > "${packages}" <<EOF
              Package: foreman-kubernetes-deb
              Version: 1.0.0
              Architecture: all
              Maintainer: Foreman Kubernetes Integration
              Installed-Size: 1
              Filename: ${deb_pool}/${deb_filename}
              Size: ${deb_size}
              MD5sum: ${deb_md5}
              SHA1: ${deb_sha1}
              SHA256: ${deb_sha256}
              Section: admin
              Priority: optional
              Description: deterministic Foreman Kubernetes Debian fixture

              EOF
              gzip -c "${packages}" > "${packages}.gz"
              packages_size="$(wc -c < "${packages}" | tr -d ' ')"
              packages_gz_size="$(wc -c < "${packages}.gz" | tr -d ' ')"
              packages_md5="$(md5sum "${packages}" | awk '{print $1}')"
              packages_gz_md5="$(md5sum "${packages}.gz" | awk '{print $1}')"
              packages_sha256="$(sha256sum "${packages}" | awk '{print $1}')"
              packages_gz_sha256="$(sha256sum "${packages}.gz" | awk '{print $1}')"
              cat > /served/debian/dists/stable/Release <<EOF
              Origin: Foreman Kubernetes Integration
              Label: Foreman Kubernetes Integration
              Suite: stable
              Codename: stable
              Date: Fri, 25 Sep 2026 00:00:00 +0000
              Architectures: amd64
              Components: main
              Description: deterministic Foreman Kubernetes Debian repository
              MD5Sum:
               ${packages_md5} ${packages_size} main/binary-amd64/Packages
               ${packages_gz_md5} ${packages_gz_size} main/binary-amd64/Packages.gz
              SHA256:
               ${packages_sha256} ${packages_size} main/binary-amd64/Packages
               ${packages_gz_sha256} ${packages_gz_size} main/binary-amd64/Packages.gz
              EOF
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: content
              mountPath: /served
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /PULP_MANIFEST
              port: http
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: source
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: content-source
        - name: content
          emptyDir: {}
---
