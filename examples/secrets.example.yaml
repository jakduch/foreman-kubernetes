# Copy this file outside Git, replace every placeholder, and apply it to the target namespace.
# Never commit the populated version.
apiVersion: v1
kind: Secret
metadata:
  name: foreman-runtime
type: Opaque
stringData:
  DATABASE_URL: postgresql://foreman:CHANGE_ME@postgres.example.test:5432/foreman
  ENCRYPTION_KEY: CHANGE_ME
  SEED_ADMIN_USER: admin
  SEED_ADMIN_PASSWORD: CHANGE_ME
  DYNFLOW_REDIS_URL: redis://valkey.example.test:6379/6
  REDIS_PROVIDER: DYNFLOW_REDIS_URL
---
apiVersion: v1
kind: Secret
metadata:
  name: pulp-runtime
type: Opaque
stringData:
  PULP_DATABASES__default__NAME: pulp
  PULP_DATABASES__default__USER: pulp
  PULP_DATABASES__default__PASSWORD: CHANGE_ME
  PULP_DATABASES__default__HOST: postgres.example.test
  PULP_DATABASES__default__PORT: "5432"
  PULP_REDIS_URL: redis://valkey.example.test:6379/8
  PULP_SECRET_KEY: CHANGE_ME
  PULP_CONTENT_ORIGIN: https://content.example.test
  PULP_ANSIBLE_API_HOSTNAME: https://content.example.test
  PULP_ANSIBLE_CONTENT_HOSTNAME: https://content.example.test/pulp/content
  PULP_ENABLED_PLUGINS: "['pulp_certguard', 'pulp_container', 'pulp_deb', 'pulp_file', 'pulp_rpm', 'pulp_smart_proxy']"
  PULP_AUTHENTICATION_BACKENDS: "['pulpcore.app.authentication.PulpNoCreateRemoteUserBackend']"
  PULP_REST_FRAMEWORK__DEFAULT_AUTHENTICATION_CLASSES: "['rest_framework.authentication.SessionAuthentication', 'pulpcore.app.authentication.PulpRemoteUserAuthentication']"
  PULP_REMOTE_USER_ENVIRON_NAME: HTTP_REMOTE_USER
  PULP_TOKEN_AUTH_DISABLED: "true"
---
