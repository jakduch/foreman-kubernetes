name: Chart checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    name: Helm ${{ matrix.helm }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        helm:
          - v3.19.0
          - v4.3.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: ${{ matrix.helm }}
      - name: Check shell scripts
        run: >-
          shellcheck tests/render.sh
          tests/kind/run.sh
          tests/kind/apply-secrets.sh
          tests/kind/content-lifecycle.sh
          tests/kind/execution-plane.sh
          tests/install-release.sh
          tests/upgrade-release.sh
          scripts/install-release.sh
          scripts/upgrade-release.sh
          scripts/recover-release.sh
          tests/recover-release.sh
          images/ssh-target/entrypoint.sh
      - name: Lint and render chart profiles
        run: tests/render.sh
